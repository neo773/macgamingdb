name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080

    env:
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_DOMAIN: localhost
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LIBSQL_DATABASE_URL: http://127.0.0.1:8080
      LIBSQL_DATABASE_TOKEN: ""
      LIBSQL_STATS_ENDPOINT: ${{ secrets.LIBSQL_STATS_ENDPOINT }}
      LIBSQL_STATS_TOKEN: ${{ secrets.LIBSQL_STATS_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check AVIF siblings
        run: bun run images:avif:check

      - name: Build workspace packages
        run: bun run build:api

      - name: Test
        run: bun run test

      - name: Build (vinext)
        run: bun run build:vinext

      - name: Build (Next.js)
        run: bun run build

  deploy:
    name: Deploy to Coolify
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions: {}

    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Trigger deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error \
            --max-time 60 \
            --write-out '\n%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          status=$(printf '%s' "${response}" | tail -n 1)
          body=$(printf '%s' "${response}" | sed '$d')
          echo "Coolify responded ${status}: ${body}"
          if [ "${status}" != "200" ]; then
            echo "::error::Coolify deploy request failed (HTTP ${status})"
            exit 1
          fi
